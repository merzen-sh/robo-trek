services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: robo-trek-prometheus
    restart: unless-stopped
    # Host network: the robo-trek app runs on the host, and this host's
    # firewall drops container->host bridge traffic. Loopback always works.
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: robo-trek-grafana
    restart: unless-stopped
    # Host network so Grafana can reach Prometheus on the host's loopback.
    network_mode: host
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"

volumes:
  prometheus-data:
  grafana-data: