global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: robo-trek
    metrics_path: /prometheus/metrics
    static_configs:
      # The app runs on the host; with host networking, its loopback is ours.
      # Expose it on the API_PORT from .env (default 8080).
      - targets: ["localhost:8080"]