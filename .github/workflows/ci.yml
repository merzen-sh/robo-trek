name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ci

      - name: Lint
        env:
          # Clippy only links build-script/proc-macro crates, so skip the mold
          # linker (set in .cargo/config.toml) and use the default rust-lld.
          RUSTFLAGS: ""
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ci

      - name: Test
        run: cargo test --all-targets --color always

  migrations:
    name: Migration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ci

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,rustls --locked

      - name: Apply migrations to a throwaway database
        env:
          DB: sqlite:///tmp/robo-trek-migrations.sqlite
        run: |
          sqlx db create --database-url "$DB"
          sqlx migrate run --source migrations --database-url "$DB"
          sqlx migrate info --source migrations --database-url "$DB" | grep installed

      - name: Revert and re-apply
        env:
          DB: sqlite:///tmp/robo-trek-migrations.sqlite
        run: |
          sqlx migrate revert --source migrations --database-url "$DB"
          sqlx migrate info --source migrations --database-url "$DB" | grep pending
          sqlx migrate run --source migrations --database-url "$DB"
          sqlx migrate info --source migrations --database-url "$DB" | grep installed
