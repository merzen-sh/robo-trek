[package]
name = "robo-trek"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = "0.12"
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
dotenvy = "0.15"
envy = "0.3"
handlebars = "6.4.4"
redb = "4.1.0"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = 'symbols'
