[package]
name = "robo-trek"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "builder",
    "chrono",
    "client",
    "gateway",
    "http",
    "model",
    "rustls_backend",
    "utils",
] }
tokio = { version = "1.21.2", features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
] }
axum = { version = "0.7", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
envy = "0.3"
handlebars = "6.4.4"
prometheus = "0.13"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
tempfile = "3.27.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 'z'
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-dev]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 16
strip = false

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
